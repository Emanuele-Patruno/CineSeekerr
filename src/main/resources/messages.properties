help=🍿 <b>CineSeekerr</b>\nSend me the title of a movie or TV series and I'll put it on Plex.\n\n<b>Commands:</b>\n/search &lt;title&gt; — search a movie or a series (or just type the title)\n/movie &lt;title&gt; — search movies only\n/tv &lt;title&gt; — search TV series only\n/status — downloads in progress\n/cancel — cancel the current operation\n/help — this message
